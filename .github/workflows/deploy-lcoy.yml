name: Deploy LCOY site to Namecheap

# Publishes lcoy-site/ to the LCOY domain on Namecheap cPanel hosting.
#
# Only the contents of lcoy-site/ are uploaded. The repo root — the main WFF
# site, the .docx concept notes and the .zip archives — is never published by
# this workflow, which is the whole reason the site lives in a subfolder.
on:
  push:
    branches: [main]
    paths:
      - 'lcoy-site/**'
      - '.github/workflows/deploy-lcoy.yml'
  workflow_dispatch:

# Two deploys writing to the same FTP directory at once corrupt the action's
# sync state. Queue them instead of racing.
concurrency:
  group: deploy-lcoy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A stalled FTP connection would otherwise hold a runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Sync lcoy-site/ to cPanel over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Explicit TLS. Never change this to "ftp" — that sends the password
          # across the internet in clear text.
          protocol: ftps
          # Trailing slashes matter to this action. Do not remove them.
          local-dir: ./lcoy-site/
          # The FTP account is rooted at /home/kigayhvn/public_html, so the
          # login already lands in the web root. Must stay ./ — setting this to
          # public_html/ would deploy into public_html/public_html/.
          server-dir: ./
          # The server lost its files while the old sync-state file still listed
          # them, so diff-only deploys never restored them. A fresh state name
          # forces one full upload; it uploads only and deletes nothing.
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/README.md
            **/.gitattributes
